<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generar Documento</title>

    {#bundle /}

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
            rel="stylesheet"
    >

    <link href="/static/bundle/styles.css" rel="stylesheet">
</head>

<body class="bg-gray-100">

<div id="app"
     class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl m-8">

    <div class="p-8">

        <h1 class="uppercase tracking-wide text-sm text-indigo-500 font-semibold mb-4">
            {{ title }}
        </h1>

        <form @submit.prevent class="space-y-4" novalidate>

            <!-- Código -->
            <div>
                <label
                        for="code"
                        class="block text-gray-700 text-sm font-bold mb-2"
                >
                    CODIGO:
                </label>

                <input
                        v-model="formData.code"
                        :disabled="loading"
                        type="text"
                        id="code"
                        required
                        placeholder="Ej. POS-48-2023-00011"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                >
            </div>


            <!-- Tipo de documento -->
            <div>
                <label
                        for="tipo"
                        class="block text-gray-700 text-sm font-bold mb-2"
                >
                    TIPO DE DOCUMENTO:
                </label>

                <select
                        v-model="formData.tipo"
                        :disabled="loading"
                        id="tipo"
                        required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                >

                    <option value="" disabled>
                        Seleccione un tipo
                    </option>

                    <option value="EXTENSION">
                        Extension
                    </option>

                    <option value="RENOVACION">
                        Renovacion
                    </option>

                    <option value="ENMIENDA">
                        Enmienda
                    </option>

                    <option value="CONSTANCIA">
                        Constancia
                    </option>

                    <option value="INFORME">
                        Informe
                    </option>

                </select>
            </div>


            <!-- Imágenes para ENMIENDA -->
            <div v-if="formData.tipo === 'ENMIENDA'">

                <label
                        for="imagenes"
                        class="block text-gray-700 text-sm font-bold mb-2"
                >
                    IMÁGENES:
                </label>

                <input
                        ref="imagenesInput"
                        @change="seleccionarImagenes"
                        :disabled="loading"
                        type="file"
                        id="imagenes"
                        accept="image/*"
                        multiple
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                >

                <p class="mt-1 text-xs text-gray-500">
                    Puede seleccionar una o varias imágenes.
                </p>


                <!-- Imágenes seleccionadas -->
                <div
                        v-if="formData.imagenes.length > 0"
                        class="mt-2"
                >

                    <p class="text-sm font-semibold text-gray-700">
                        Imágenes seleccionadas:
                    </p>

                    <ul class="mt-1 text-sm text-gray-600">

                        <li
                                v-for="imagen in formData.imagenes"
                                :key="imagen.name + imagen.size + imagen.lastModified"
                        >
                            {{ imagen.name }}
                        </li>

                    </ul>

                </div>

            </div>


            <!-- Botones -->
            <div class="flex flex-col sm:flex-row gap-3 pt-2">

                <!-- Word -->
                <button
                        type="button"
                        @click="generarDocumento('word')"
                        :disabled="loading"
                        class="flex-1 bg-blue-500 hover:bg-blue-700 disabled:opacity-60 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                >

                    <span v-if="!(loading && formato === 'word')">
                        Generar Word
                    </span>

                    <span v-else>
                        Generando Word...
                    </span>

                </button>


                <!-- PDF -->
                <button
                        type="button"
                        @click="generarDocumento('pdf')"
                        :disabled="loading"
                        class="flex-1 bg-red-500 hover:bg-red-700 disabled:opacity-60 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                >

                    <span v-if="!(loading && formato === 'pdf')">
                        Generar PDF
                    </span>

                    <span v-else>
                        Generando PDF...
                    </span>

                </button>

            </div>

        </form>


        <!-- Mensaje de éxito -->
        <p
                v-if="mensaje"
                class="mt-4 text-green-600"
        >
            {{ mensaje }}
        </p>


        <!-- Mensaje de error -->
        <p
                v-if="error"
                class="mt-4 text-red-600"
        >
            {{ error }}
        </p>

    </div>

</div>


<script type="module">

    const {
        createApp,
        ref,
        watch
    } = Vue


    createApp({

        setup() {

            const title =
                ref('Generar Documento')


            const formData =
                ref({
                    code: '',
                    tipo: '',
                    imagenes: []
                })


            const mensaje =
                ref('')

            const error =
                ref('')

            const loading =
                ref(false)

            const formato =
                ref('')


            const imagenesInput =
                ref(null)


            /*
             * Cuando el usuario cambia de
             * ENMIENDA a cualquier otro tipo,
             * se limpian las imágenes.
             *
             * Esto limpia tanto:
             *
             * 1. El estado de Vue.
             * 2. El input type="file".
             */
            watch(
                () => formData.value.tipo,

                (nuevoTipo) => {

                    if (nuevoTipo !== 'ENMIENDA') {

                        formData.value.imagenes = []


                        /*
                         * Limpiar el input físico
                         * para que tampoco quede
                         * visible el nombre de los
                         * archivos seleccionados.
                         */
                        if (imagenesInput.value) {

                            imagenesInput.value.value = ''

                        }

                    }

                }
            )


            /*
             * Obtiene el nombre del archivo
             * desde Content-Disposition.
             */
            function filenameFromDisposition(
                disposition,
                fallback
            ) {

                if (!disposition) {

                    return fallback

                }


                const reUtf8 =
                    /filename\*=UTF-8''([^;]+)/i


                const reName =
                    /filename=\"?([^\";]+)\"?/i


                let m =
                    reUtf8.exec(disposition)


                if (m && m[1]) {

                    try {

                        return decodeURIComponent(
                            m[1]
                        )

                    } catch (e) {

                    }

                }


                m =
                    reName.exec(disposition)


                if (m && m[1]) {

                    return m[1]

                }


                return fallback

            }


            /*
             * Guardar imágenes seleccionadas.
             */
            function seleccionarImagenes(event) {

                const files =
                    Array.from(
                        event.target.files || []
                    )


                formData.value.imagenes =
                    files

            }


            /*
             * Generar documento.
             *
             * tipoFormato:
             *
             *   - word
             *   - pdf
             */
            const generarDocumento =
                async (tipoFormato) => {

                    mensaje.value = ''

                    error.value = ''


                    /*
                     * Obtener código.
                     */
                    const codigo =
                        (
                            formData.value.code ||
                            ''
                        ).trim()


                    /*
                     * Obtener tipo.
                     */
                    const tipoDocumento =
                        formData.value.tipo


                    /*
                     * Validación del código.
                     */
                    if (!codigo) {

                        error.value =
                            'El código es requerido.'

                        return

                    }


                    /*
                     * Validación del tipo.
                     */
                    if (!tipoDocumento) {

                        error.value =
                            'Debe seleccionar un tipo de documento.'

                        return

                    }


                    /*
                     * Validación de imágenes
                     * para ENMIENDA.
                     */
                    if (
                        tipoDocumento === 'ENMIENDA' &&
                        formData.value.imagenes.length === 0
                    ) {

                        error.value =
                            'Debe seleccionar al menos una imagen para la enmienda.'

                        return

                    }


                    loading.value = true

                    formato.value =
                        tipoFormato


                    try {

                        /*
                         * Mapeo del tipo seleccionado
                         * al path del endpoint.
                         */
                        const endpointTipo = {

                            EXTENSION:
                                'extencion',

                            RENOVACION:
                                'renovacion',

                            ENMIENDA:
                                'enmienda',

                            CONSTANCIA:
                                'constancia',
                            INFORME:
                                'informe'

                        }[tipoDocumento]


                        /*
                         * Construir URL.
                         */
                        const url =
                            '/document/' +
                            endpointTipo +
                            '/v1/' +
                            tipoFormato


                        let resp


                        /*
                         * ==================================
                         * ENMIENDA
                         * ==================================
                         *
                         * El backend espera:
                         *
                         * @RestForm("codigo")
                         * @RestForm("imagenes")
                         *
                         * Por eso se utiliza FormData.
                         */
                        if (
                            tipoDocumento === 'ENMIENDA'
                        ) {

                            const form =
                                new FormData()


                            /*
                             * Agregar código.
                             */
                            form.append(
                                'codigo',
                                codigo
                            )


                            /*
                             * Agregar todas las imágenes
                             * utilizando el mismo nombre:
                             *
                             * "imagenes"
                             */
                            formData.value.imagenes.forEach(
                                (imagen) => {

                                    form.append(
                                        'imagenes',
                                        imagen,
                                        imagen.name
                                    )

                                }
                            )


                            console.log(
                                'POST multipart:',
                                url
                            )


                            console.log(
                                'Código:',
                                codigo
                            )


                            console.log(
                                'Imágenes:',
                                formData.value.imagenes
                            )


                            /*
                             * IMPORTANTE:
                             *
                             * No establecer manualmente
                             * Content-Type.
                             *
                             * El navegador agrega
                             * automáticamente:
                             *
                             * multipart/form-data;
                             * boundary=...
                             */
                            resp =
                                await fetch(
                                    url,
                                    {

                                        method: 'POST',

                                        headers: {

                                            'Accept':
                                                'application/pdf'

                                        },

                                        body: form

                                    }
                                )

                        } else {

                            /*
                             * ==================================
                             * RESTO DE DOCUMENTOS
                             * ==================================
                             *
                             * Se mantiene el comportamiento
                             * original utilizando JSON.
                             */
                            const request = {

                                codigo:
                                codigo,

                                tipoDocumento:
                                tipoDocumento

                            }


                            console.log(
                                'POST:',
                                url
                            )


                            console.log(
                                'Request:',
                                request
                            )


                            resp =
                                await fetch(
                                    url,
                                    {

                                        method: 'POST',

                                        headers: {

                                            'Content-Type':
                                                'application/json',

                                            'Accept':
                                                tipoFormato === 'pdf'

                                                    ? 'application/pdf'

                                                    : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'

                                        },

                                        body:
                                            JSON.stringify(
                                                request
                                            )

                                    }
                                )

                        }


                        /*
                         * ==================================
                         * ERRORES HTTP
                         * ==================================
                         */

                        if (
                            resp.status === 400
                        ) {

                            const txt =
                                await resp.text()


                            error.value =
                                txt ||
                                'Solicitud inválida.'


                            return

                        }


                        if (
                            resp.status === 404
                        ) {

                            const txt =
                                await resp.text()


                            error.value =
                                txt ||
                                'Documento no encontrado.'


                            return

                        }


                        if (
                            resp.status >= 400
                        ) {

                            const txt =
                                await resp.text()


                            error.value =
                                txt ||
                                'Error del servidor: ' +
                                resp.status


                            return

                        }


                        /*
                         * ==================================
                         * OBTENER ARCHIVO
                         * ==================================
                         */

                        const blob =
                            await resp.blob()


                        /*
                         * Obtener nombre enviado
                         * por el backend.
                         */
                        const disposition =
                            resp.headers.get(
                                'content-disposition'
                            )


                        /*
                         * Extensión por defecto.
                         */
                        const extension =
                            tipoFormato === 'pdf'
                                ? 'pdf'
                                : 'docx'


                        /*
                         * Nombre por defecto.
                         */
                        const fallbackName =
                            'document_' +
                            tipoDocumento.toLowerCase() +
                            '_' +
                            codigo +
                            '.' +
                            extension


                        /*
                         * Obtener nombre final.
                         */
                        const filename =
                            filenameFromDisposition(
                                disposition,
                                fallbackName
                            )


                        /*
                         * Crear URL temporal
                         * para descargar el archivo.
                         */
                        const urlObj =
                            window.URL.createObjectURL(
                                blob
                            )


                        const a =
                            document.createElement(
                                'a'
                            )


                        a.href =
                            urlObj


                        a.download =
                            filename


                        document.body.appendChild(
                            a
                        )


                        a.click()


                        a.remove()


                        window.URL.revokeObjectURL(
                            urlObj
                        )


                        /*
                         * Mensaje de éxito.
                         */
                        mensaje.value =
                            'Documento ' +
                            tipoFormato.toUpperCase() +
                            ' generado correctamente.'

                        /*
                         * Limpiar el formulario después
                         * de generar correctamente el documento.
                         */
                        formData.value.code = ''


                    } catch (e) {

                        console.error(
                            'Error generando documento:',
                            e
                        )


                        error.value =
                            'Error al procesar la solicitud.'


                    } finally {

                        loading.value =
                            false

                        formato.value =
                            ''

                    }

                }


            return {

                title,

                formData,

                mensaje,

                error,

                loading,

                formato,

                imagenesInput,

                seleccionarImagenes,

                generarDocumento

            }

        }

    }).mount('#app')

</script>

</body>
</html>
