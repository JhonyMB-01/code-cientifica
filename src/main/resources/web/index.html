<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Generar Documento</title>

    {#bundle /}

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <link
            href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
            rel="stylesheet"
    >

    <link
            href="/static/bundle/styles.css"
            rel="stylesheet"
    >

</head>


<body class="bg-gray-100">


<div
        id="app"
        class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl m-8"
>


    <div class="p-8">


        <!-- Título -->

        <h1
                class="uppercase tracking-wide text-sm text-indigo-500 font-semibold mb-4"
        >
            {{ title }}
        </h1>


        <form
                @submit.prevent
                class="space-y-4"
                novalidate
        >


            <!-- ========================================= -->
            <!-- Código                                    -->
            <!-- ========================================= -->

            <div>

                <label
                        for="code"
                        class="block text-gray-700 text-sm font-bold mb-2"
                >
                    CODIGO:
                </label>


                <input
                        v-model="formData.code"
                        :disabled="loading"
                        type="text"
                        id="code"
                        required
                        placeholder="Ej. POS-48-2023-00011"
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                >

            </div>


            <!-- ========================================= -->
            <!-- Checkbox animales                         -->
            <!-- ========================================= -->

            <div class="flex items-center">

                <input
                        id="soloAnimales"
                        type="checkbox"
                        v-model="soloAnimales"
                        :disabled="loading"
                        class="h-4 w-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500"
                >


                <label
                        for="soloAnimales"
                        class="ml-2 text-sm font-medium text-gray-700"
                >
                    Solo documentos de animales
                </label>

            </div>


            <!-- ========================================= -->
            <!-- Tipo de documento                         -->
            <!-- ========================================= -->

            <div>

                <label
                        for="tipo"
                        class="block text-gray-700 text-sm font-bold mb-2"
                >
                    TIPO DE DOCUMENTO:
                </label>


                <select
                        v-model="formData.tipo"
                        :disabled="loading"
                        id="tipo"
                        required
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                >


                    <option
                            value=""
                            disabled
                    >
                        Seleccione un tipo
                    </option>


                    <!-- ================================= -->
                    <!-- Documentos normales                -->
                    <!-- ================================= -->

                    <template v-if="!soloAnimales">

                        <option value="EXTENSION">
                            Extension
                        </option>


                        <option value="RENOVACION">
                            Renovacion
                        </option>


                        <option value="ENMIENDA">
                            Enmienda
                        </option>


                        <option value="CONSTANCIA">
                            Constancia
                        </option>


                        <option value="INFORME">
                            Informe
                        </option>


                        <option value="EXENTA">
                            Exenta
                        </option>

                    </template>


                    <!-- ================================= -->
                    <!-- Documentos de animales             -->
                    <!-- ================================= -->

                    <template v-if="soloAnimales">

                        <option value="APROBACION_ANIMAL">
                            Aprobacion animal
                        </option>


                        <option value="ENMIENDA_ANIMAL">
                            Enmienda animal
                        </option>

                    </template>


                </select>

            </div>


            <!-- ========================================= -->
            <!-- Botones                                   -->
            <!-- ========================================= -->

            <div
                    class="flex flex-col sm:flex-row gap-3 pt-2"
            >


                <!-- Word -->

                <button
                        type="button"
                        @click="generarDocumento('word')"
                        :disabled="loading"
                        class="flex-1 bg-blue-500 hover:bg-blue-700 disabled:opacity-60 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                >


                    <span
                            v-if="!(loading && formato === 'word')"
                    >
                        Generar Word
                    </span>


                    <span
                            v-else
                    >
                        Generando Word...
                    </span>


                </button>


                <!-- PDF -->

                <button
                        type="button"
                        @click="generarDocumento('pdf')"
                        :disabled="loading"
                        class="flex-1 bg-red-500 hover:bg-red-700 disabled:opacity-60 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                >


                    <span
                            v-if="!(loading && formato === 'pdf')"
                    >
                        Generar PDF
                    </span>


                    <span
                            v-else
                    >
                        Generando PDF...
                    </span>


                </button>


            </div>


        </form>


        <!-- ========================================= -->
        <!-- Mensaje de éxito                          -->
        <!-- ========================================= -->

        <p
                v-if="mensaje"
                class="mt-4 text-green-600"
        >
            {{ mensaje }}
        </p>


        <!-- ========================================= -->
        <!-- Mensaje de error                           -->
        <!-- ========================================= -->

        <p
                v-if="error"
                class="mt-4 text-red-600"
        >
            {{ error }}
        </p>


    </div>


</div>


<script type="module">


    const {
        createApp,
        ref,
        watch
    } = Vue


    createApp({

        setup() {


            // =========================================
            // Título
            // =========================================

            const title =
                ref('Generar Documento')


            // =========================================
            // Datos del formulario
            // =========================================

            const formData =
                ref({

                    code: '',

                    tipo: ''

                })


            // =========================================
            // Checkbox:
            // Solo documentos de animales
            // =========================================

            const soloAnimales =
                ref(false)


            // =========================================
            // Mensajes
            // =========================================

            const mensaje =
                ref('')


            const error =
                ref('')


            // =========================================
            // Estado de carga
            // =========================================

            const loading =
                ref(false)


            const formato =
                ref('')


            // =========================================
            // Cuando cambia el checkbox
            // =========================================
            //
            // Si se activa "Solo animales", eliminamos
            // cualquier selección anterior que no sea
            // un documento animal.
            //
            // =========================================

            watch(
                soloAnimales,
                (nuevoValor) => {

                    if (
                        nuevoValor &&
                        formData.value.tipo !== 'APROBACION_ANIMAL' &&
                        formData.value.tipo !== 'ENMIENDA_ANIMAL'
                    ) {

                        formData.value.tipo = ''

                    }

                }
            )


            // =========================================
            // Obtener nombre del archivo
            // =========================================

            function filenameFromDisposition(
                disposition,
                fallback
            ) {


                if (!disposition) {

                    return fallback

                }


                const reUtf8 =
                    /filename\*=UTF-8''([^;]+)/i


                const reName =
                    /filename=\"?([^\";]+)\"?/i


                let m =
                    reUtf8.exec(
                        disposition
                    )


                if (
                    m &&
                    m[1]
                ) {


                    try {

                        return decodeURIComponent(
                            m[1]
                        )

                    } catch (e) {

                    }

                }


                m =
                    reName.exec(
                        disposition
                    )


                if (
                    m &&
                    m[1]
                ) {

                    return m[1]

                }


                return fallback

            }


            // =========================================
            // Generar documento
            // =========================================

            const generarDocumento =
                async (tipoFormato) => {


                    // ---------------------------------
                    // Limpiar mensajes
                    // ---------------------------------

                    mensaje.value = ''

                    error.value = ''


                    // ---------------------------------
                    // Obtener código
                    // ---------------------------------

                    const codigo =
                        (
                            formData.value.code ||
                            ''
                        ).trim()


                    // ---------------------------------
                    // Obtener tipo
                    // ---------------------------------

                    const tipoDocumento =
                        formData.value.tipo


                    // ---------------------------------
                    // Validar código
                    // ---------------------------------

                    if (!codigo) {

                        error.value =
                            'El código es requerido.'

                        return

                    }


                    // ---------------------------------
                    // Validar tipo
                    // ---------------------------------

                    if (!tipoDocumento) {

                        error.value =
                            'Debe seleccionar un tipo de documento.'

                        return

                    }


                    // ---------------------------------
                    // Validar coherencia del filtro
                    // ---------------------------------

                    if (
                        soloAnimales.value &&
                        tipoDocumento !== 'APROBACION_ANIMAL' &&
                        tipoDocumento !== 'ENMIENDA_ANIMAL'
                    ) {

                        error.value =
                            'Debe seleccionar un documento de animales.'

                        return

                    }


                    loading.value =
                        true


                    formato.value =
                        tipoFormato


                    try {


                        // =================================
                        // Mapeo de endpoints
                        // =================================

                        const endpointTipo = {


                            EXTENSION:
                                'extencion',


                            RENOVACION:
                                'renovacion',


                            ENMIENDA:
                                'enmienda',


                            CONSTANCIA:
                                'constancia',


                            INFORME:
                                'informe',


                            EXENTA:
                                'exenta',


                            APROBACION_ANIMAL:
                                'aprobacionAnimal',


                            ENMIENDA_ANIMAL:
                                'enmiendaAnimal'


                        }[tipoDocumento]


                        // ---------------------------------
                        // Validar endpoint
                        // ---------------------------------

                        if (!endpointTipo) {

                            error.value =
                                'Tipo de documento no válido.'

                            return

                        }


                        // =================================
                        // Construir URL
                        // =================================

                        const url =
                            '/document/' +
                            endpointTipo +
                            '/v1/' +
                            tipoFormato


                        // =================================
                        // Request
                        // =================================

                        const request = {


                            codigo:
                                codigo,


                            tipoDocumento:
                                tipoDocumento


                        }


                        console.log(
                            'POST:',
                            url
                        )


                        console.log(
                            'Request:',
                            request
                        )


                        // =================================
                        // Ejecutar POST
                        // =================================

                        const resp =
                            await fetch(
                                url,
                                {

                                    method:
                                        'POST',


                                    headers:
                                        {

                                            'Content-Type':
                                                'application/json',


                                            'Accept':
                                                tipoFormato === 'pdf'

                                                    ? 'application/pdf'

                                                    : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'

                                        },


                                    body:
                                        JSON.stringify(
                                            request
                                        )

                                }
                            )


                        // =================================
                        // ERRORES HTTP
                        // =================================

                        if (
                            resp.status === 400
                        ) {


                            const txt =
                                await resp.text()


                            error.value =
                                txt ||
                                'Solicitud inválida.'


                            return

                        }


                        if (
                            resp.status === 404
                        ) {


                            const txt =
                                await resp.text()


                            error.value =
                                txt ||
                                'Documento no encontrado.'


                            return

                        }


                        if (
                            resp.status >= 400
                        ) {


                            const txt =
                                await resp.text()


                            error.value =
                                txt ||
                                'Error del servidor: ' +
                                resp.status


                            return

                        }


                        // =================================
                        // Obtener archivo
                        // =================================

                        const blob =
                            await resp.blob()


                        // =================================
                        // Content-Disposition
                        // =================================

                        const disposition =
                            resp.headers.get(
                                'content-disposition'
                            )


                        // =================================
                        // Extensión
                        // =================================

                        const extension =
                            tipoFormato === 'pdf'
                                ? 'pdf'
                                : 'docx'


                        // =================================
                        // Nombre por defecto
                        // =================================

                        const fallbackName =
                            'document_' +
                            tipoDocumento.toLowerCase() +
                            '_' +
                            codigo +
                            '.' +
                            extension


                        // =================================
                        // Nombre final
                        // =================================

                        const filename =
                            filenameFromDisposition(
                                disposition,
                                fallbackName
                            )


                        // =================================
                        // Crear descarga
                        // =================================

                        const urlObj =
                            window.URL.createObjectURL(
                                blob
                            )


                        const a =
                            document.createElement(
                                'a'
                            )


                        a.href =
                            urlObj


                        a.download =
                            filename


                        document.body.appendChild(
                            a
                        )


                        a.click()


                        a.remove()


                        window.URL.revokeObjectURL(
                            urlObj
                        )


                        // =================================
                        // Mensaje de éxito
                        // =================================

                        mensaje.value =
                            'Documento ' +
                            tipoFormato.toUpperCase() +
                            ' generado correctamente.'


                    } catch (e) {


                        console.error(
                            'Error generando documento:',
                            e
                        )


                        error.value =
                            'Error al procesar la solicitud.'


                    } finally {


                        loading.value =
                            false


                        formato.value =
                            ''


                    }

                }


            // =========================================
            // Retorno
            // =========================================

            return {


                title,


                formData,


                soloAnimales,


                mensaje,


                error,


                loading,


                formato,


                generarDocumento


            }

        }

    }).mount('#app')


</script>


</body>

</html>
